name: Champions Hyper UI Bridge Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'champions-hyper-ui-bridge/**'
      - '.github/workflows/champions-hyper-ui-bridge.yml'
      - 'champions-hyper-scroll-client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build bridge (without redistributing original HyperNetwork binary)
        run: gradle -p champions-hyper-ui-bridge build --no-daemon --stacktrace
      - name: Build mouse wheel client addon
        run: gradle -p champions-hyper-scroll-client build --no-daemon --stacktrace
      - name: Assemble server/client installation pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/01_server_mods release/02_client_mods
          cp champions-hyper-ui-bridge/build/libs/champions-hyper-ui-bridge-0.4.0-alpha.jar release/01_server_mods/
          cp champions-hyper-scroll-client/build/libs/champions-hyper-scroll-client-0.1.0-alpha.jar release/02_client_mods/
          cat > release/README_KO.txt <<'EOF'
          Champions Hyper UI Bridge 0.4.0 Alpha — Fabric 1.21.1, Cobblemon 1.8.1
          
          서버: 기존 champions-hyper-ui-bridge-0.3.0-alpha.jar를 제거하고
          01_server_mods 안의 0.4.0-alpha.jar를 서버 mods 폴더에 설치합니다.
          HyperPartyPresetNet / HyperPokeBuilderNet 원본 서버 통신 모드는 유지합니다.
          
          클라이언트: 02_client_mods의 champions-hyper-scroll-client-0.1.0-alpha.jar만
          mods 폴더에 추가합니다. v0.2의 HyperLib, HyperPokeBuilderUI,
          HyperPartyPreset 원본(또는 Champions 표기 패치본)은 변경하지 않습니다.
          
          포켓빌더: /하이퍼빌더
          편집 가능한 메뉴: 개체값 / 노력치 / 성격 / 특성
          삭제되는 편집 메뉴: 레벨 / 성별 / 친밀도 / 볼 / 크기
          
          파티가 여섯 마리면 빌더의 왼쪽 파티 목록 위에서
          마우스 휠을 아래로 내리면 2~6번째, 위로 올리면 1~5번째가
          표시되도록 서버에서 원본 View 패킷 목록을 전환합니다.
          
          주의: 실제 게임 UI에서 스크롤 갱신과 선택 동작은 아직
          검증되지 않았습니다. 테스트 월드/저장 파일 백업 후 사용하세요.
          원본 스크린 구조를 변경하지 않은 서버 페이징 방식입니다.
          EOF
          cd release
          zip -r ../Champions_Hyper_Builder_v0.4.0_Fabric_1.21.1.zip .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: champions-hyper-builder-server-client-v0.4.0
          path: Champions_Hyper_Builder_v0.4.0_Fabric_1.21.1.zip
          if-no-files-found: error
