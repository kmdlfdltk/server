name: Champions Hyper Scroll Client Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'champions-hyper-scroll-client/**'
      - '.github/workflows/champions-hyper-scroll-client.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Compile client mouse wheel addon
        run: gradle -p champions-hyper-scroll-client build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: champions-hyper-scroll-client-v0.1.0-alpha
          path: champions-hyper-scroll-client/build/libs/champions-hyper-scroll-client-0.1.0-alpha.jar
          if-no-files-found: error
