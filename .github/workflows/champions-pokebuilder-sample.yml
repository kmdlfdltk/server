name: Champions PokeBuilder Sample

on:
  workflow_dispatch:
  push:
    paths:
      - 'champions-pokebuilder-sample/**'
      - '.github/workflows/champions-pokebuilder-sample.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build standalone Fabric 1.21.1 PokeBuilder
        run: gradle -p champions-pokebuilder-sample build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: champions-pokebuilder-v0.1.0-alpha-fabric-1.21.1
          path: champions-pokebuilder-sample/build/libs/champions-pokebuilder-0.1.0-alpha.jar
          if-no-files-found: error
